<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="tents-title">
  <title id="tents-title">Three tents and a campfire on a meadow by the lake, under the moon</title>
  <defs>
    <linearGradient id="tents-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141833"/>
      <stop offset="1" stop-color="#3b4a7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#tents-sky)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="30" r="1.4"/>
    <circle cx="140" cy="56" r="1.2"/>
    <circle cx="210" cy="24" r="1.5"/>
    <circle cx="260" cy="70" r="1.2"/>
    <circle cx="380" cy="40" r="1.3"/>
  </g>
  <circle cx="320" cy="58" r="20" fill="#f5e6a8"/>
  <!-- far shore and lake -->
  <polygon points="0,160 70,128 140,152 210,124 290,150 360,132 400,146 400,170 0,170" fill="#22284a"/>
  <rect y="168" width="400" height="40" fill="#264653"/>
  <g stroke="#f5e6a8" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="180" x2="340" y2="180"/>
    <line x1="308" y1="192" x2="332" y2="192"/>
  </g>
  <!-- meadow -->
  <rect y="204" width="400" height="96" fill="#2a6f4b"/>
  <!-- pine trees -->
  <g fill="#163a2a">
    <polygon points="30,116 6,212 54,212"/>
    <polygon points="62,140 42,214 82,214"/>
  </g>
  <!-- tents -->
  <polygon points="110,270 160,200 210,270" fill="#e76f51"/>
  <polygon points="160,200 145,270 175,270" fill="#7a2e1f"/>
  <polygon points="220,262 262,206 304,262" fill="#f5c451"/>
  <polygon points="262,206 250,262 274,262" fill="#8a6a1a"/>
  <polygon points="300,276 345,214 390,276" fill="#2a9d8f"/>
  <polygon points="345,214 333,276 357,276" fill="#1d5e57"/>
  <!-- campfire -->
  <g fill="#5a3825">
    <rect x="58" y="270" width="44" height="7" rx="3" transform="rotate(-12 80 273)"/>
    <rect x="58" y="270" width="44" height="7" rx="3" transform="rotate(12 80 273)"/>
  </g>
  <path d="M80 238 C 92 252 96 262 80 270 C 64 262 68 252 80 238 Z" fill="#f4a261"/>
  <path d="M80 250 C 87 258 88 264 80 269 C 72 264 73 258 80 250 Z" fill="#ffd166"/>
</svg>
